# /etc/nginx/sites-available/rollycall: __DOMAIN__ + www (phase 2, after certbot issued the certificate).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    return 301 https://__DOMAIN__$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/rollycall.access.log rc_noip;
    error_log /var/log/nginx/rollycall.error.log crit;
    absolute_redirect off;
    gzip on; gzip_vary on; gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain;
    client_max_body_size 2k;
    limit_req_status 429;
    set $upstream http://127.0.0.1:__PORT__;

    location = /api/metric {
        limit_req zone=rc_metric burst=5 nodelay;
        include /etc/nginx/snippets/rollycall-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection "";
    }
    location /api/holder/ {
        limit_req zone=rc_holder burst=3 nodelay;
        include /etc/nginx/snippets/rollycall-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 15s;
    }
    location ~ ^/api/agent/[0-9]+/card$ {
        limit_req zone=rc_card burst=10 nodelay;
        include /etc/nginx/snippets/rollycall-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 20s;
    }
    location /agent/ {
        limit_req zone=rc_agentpage burst=20 nodelay;
        include /etc/nginx/snippets/rollycall-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 20s;
    }
    location = /api {
        limit_req zone=rc_api burst=40 nodelay;
        include /etc/nginx/snippets/rollycall-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 20s;
    }
    location /api/ {
        limit_req zone=rc_api burst=40 nodelay;
        include /etc/nginx/snippets/rollycall-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 20s;
    }
    location ~ ^/(dist|fonts)/ {
        include /etc/nginx/snippets/rollycall-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection "";
    }
    location / {
        limit_req zone=rc_page burst=60 nodelay;
        include /etc/nginx/snippets/rollycall-headers.conf;
        proxy_pass $upstream; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_read_timeout 20s;
    }
}
