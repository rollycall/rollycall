# /etc/nginx/conf.d/rollycall-zones.conf (http context). IPs live only in nginx memory for rate limiting; the access log has no address.
limit_req_zone $binary_remote_addr zone=rc_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=rc_holder:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rc_metric:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=rc_page:10m rate=300r/m;
# Live card checks and agent pages: slows bulk scraping, roomy for people and MCP clients.
limit_req_zone $binary_remote_addr zone=rc_card:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=rc_agentpage:10m rate=60r/m;
log_format rc_noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent $request_time';
